
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write2Text Intelligence Dashboard</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.1">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard">
        <!-- Main Analysis Panel -->
        <div class="main-panel">
            <div class="header">
                <h1>Write2Text.AI</h1>
                <div class="model-badge" id="model-badge">
                    <div class="status-dot"></div>
                    <span>CRNN Neural Engine (Epoch <span id="model-epoch">...</span>)</span>
                </div>
            </div>

            <div class="upload-zone" id="drop-zone">
                <input type="file" id="file-input" hidden accept="image/*">
                <div id="upload-prompt">
                    <i class="fas fa-microchip"></i>
                    <p>Initialize scanning process</p>
                    <p style="font-size: 0.8rem; margin-top: 0.5rem; opacity: 0.6;">Drop image or click to browse</p>
                </div>
                <img id="image-preview" alt="Scan Preview">
            </div>

            <div class="controls">
                <button id="predict-btn" class="btn btn-primary" disabled>
                    <div class="loader" id="loader"></div>
                    <span id="btn-text">Execute Prediction</span>
                </button>
                <div style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: var(--text-dim);">
                    <input type="checkbox" id="beam_search_toggle" style="accent-color: var(--primary);" checked>
                    <label for="beam_search_toggle">Deep Beam Analysis</label>
                </div>
                <button id="clear-btn" class="btn btn-secondary" style="display: none; margin-left: auto;">
                    Reset
                </button>
            </div>

            <div id="result-area">
                <p class="result-header">Neural Output</p>
                <div id="prediction" class="prediction-text">...</div>
                
                <div class="metrics-grid">
                    <div class="metric-card">
                        <div id="conf-val" class="metric-val">0%</div>
                        <div class="metric-label">Model Confidence</div>
                    </div>
                    <div class="metric-card">
                        <div id="time-val" class="metric-val">0ms</div>
                        <div class="metric-label">Inference Latency</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sidebar / History -->
        <div class="side-panel">
            <h3>Recognition History</h3>
            <div id="history-list">
                <p style="color: var(--text-dim); font-size: 0.8rem; text-align: center; margin-top: 2rem;">No recent scans</p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}?v=1.1"></script>
</body>
</html>
